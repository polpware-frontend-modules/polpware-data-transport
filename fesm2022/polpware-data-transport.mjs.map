<div class="modal-header" polpModalDraggable>
    <h4 class="modal-title">{{title}}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="close()">
    </button>
</div>
<div class="modal-body">
    <ngx-file-drop
        [multiple]="multiple"
        [accept]="accept"
        (onFileDrop)="onSelect($event)">
        <ng-template ngx-file-drop-content-tmp>
            Drop a file
        </ng-template>
    </ngx-file-drop>

    <div class="file-previews">
        <div class="preview-item" *ngFor="let f of items">
            <span>{{ f.name }} ({{ f.type }})</span>
            <button (click)="onRemove(f)">Remove</button>
        </div>
    </div>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="close()">Cancel</button>
    <button class="btn btn-primary" (click)="confirm()" [disabled]="!valid">
        <fa-icon [icon]="faSave" class="me-1"></fa-icon> <span>Confirm</span>
    </button>
</div>
