<div class="card">
    <div class="card-body">

        <div class="btn-toolbar mb-4" role="toolbar" aria-label="Operations">
            <div class="btn-group me-2" role="group" aria-label="Upload">
                <button class="btn btn-success" role="button" (click)="uploadSelectedAsync()" [disabled]="selected.length <= 0">
                    <fa-icon [icon]="faArrowUp" class="me-1"></fa-icon>
                    Upload selected
                </button>
                <button class="btn btn-info" role="button" (click)="uploadAllAsync()" [disabled]="anyKeyword">
                    <fa-icon [icon]="faArrowCircleUp" class="me-1"></fa-icon>
                    Upload all
                </button>
                <button class="btn btn-warning" role="button" (click)="uploadAllAsync()" [disabled]="!anyKeyword">
                    <fa-icon [icon]="faArrowCircleUp" class="me-1"></fa-icon>
                    Upload filtered
                </button>
            </div>
        </div>

        <polp-bs-expandable-card [isCollapsed]="!showLogs">
            <span title>
                Data import logs
            </span>
            <div class="container" body>
                <log-monitor
                    [logStream]="logStream"
                    theme="dark"
                    title="logs"
                    [animated]="true"
                    [icons]="true">
                </log-monitor>
            </div>
        </polp-bs-expandable-card>

        <polp-bs-search-box-widget #searchBox4DataPub
                                   [debounceTime]="200"
                                   [minLength]="2"
                                   formClass="border rounded my-2 py-4 px-4 bg-light"
                                   (onSearch)="kickOffSearch()">
        </polp-bs-search-box-widget>
                    
        <ngx-datatable #datatable
            class="bootstrap"
            [rows]="rows"
            [columns]="columns"
            [columnMode]="ColumnMode.force"
            headerHeight="auto"
            [footerHeight]="50"
            rowHeight="auto"
            [limit]="pageSize"
            [scrollbarH]="true"
            [selected]="selected"
            [selectionType]="SelectionType.checkbox"
            [selectAllRowsOnPage]="true"
            (select)="onSelect($event)">
        </ngx-datatable>

        <ng-template #titleHeader let-column="column">
            <div [innerHTML]="column.name" class="fw-bold text-wrap"></div>
        </ng-template>

        <ng-template #inputCell let-rowIndex="rowIndex" let-row="row" let-column="column" let-value="value">
            <span *ngIf="!editing[rowIndex + '-' + column.prop]" [innerHTML]="value">
            </span>
            <input autofocus
                   *ngIf="editing[rowIndex + '-' + column.prop]"
                   [type]="column.inputType"
                   [value]="value"
                   (blur)="updateValue($event, column.prop, rowIndex)"
            />            
        </ng-template>

        <ng-template #stateHeader let-column="column">
            <span class="fw-bold text-warp">
                State
            </span>
        </ng-template>

        <ng-template #stateCell let-value="value">
            <ng-container [ngSwitch]="value">
                <span class="text-info" *ngSwitchCase="'waiting'">
                    <fa-icon [icon]="faHourglass">
                    </fa-icon>
                </span>
                <span class="text-info" *ngSwitchCase="'working'">
                    <fa-icon [icon]="faHourglass" faSpin>
                    </fa-icon>
                </span>
                <span class="text-success" *ngSwitchCase="'success'">
                    <fa-icon [icon]="faCheck" >
                    </fa-icon>
                </span>
                <span class="text-danger" *ngSwitchCase="'failure'">
                    <fa-icon [icon]="faTimes">
                    </fa-icon>
                </span>
            </ng-container>
        </ng-template>
    </div>
</div>
